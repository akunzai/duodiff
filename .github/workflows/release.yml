name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          BIN="target/${TARGET}/release/duodiff"
          PKG="duodiff-${REF_NAME}-${TARGET}"
          mkdir "$PKG"
          cp "$BIN" "$PKG/"
          cp README.md LICENSE "$PKG/"
          tar -czf "${PKG}.tar.gz" "$PKG"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          echo "ASSET=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $bin = "target\${env:TARGET}\release\duodiff.exe"
          $pkg = "duodiff-${env:REF_NAME}-${env:TARGET}"
          New-Item -ItemType Directory $pkg
          Copy-Item $bin, README.md, LICENSE $pkg\
          Compress-Archive -Path $pkg -DestinationPath "${pkg}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "${pkg}.zip").Hash.ToLower()
          # Write LF-terminated (no CRLF, no BOM) so `sha256sum -c` under Git Bash
          # doesn't see a trailing CR glued to the filename.
          [System.IO.File]::WriteAllText("$pwd/${pkg}.zip.sha256", "$hash  ${pkg}.zip`n")
          "ASSET=${pkg}.zip" | Out-File -Append $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Update Scoop manifest
        env:
          HOMEBREW_BUMP_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_BUMP_TOKEN" ]; then
            echo "HOMEBREW_BUMP_TOKEN is not set; skipping Scoop manifest update."
            exit 0
          fi
          
          # Clone the scoop repo
          git clone "https://x-access-token:${HOMEBREW_BUMP_TOKEN}@github.com/akunzai/scoop-bucket.git" scoop-bucket
          
          # Get SHA256 checksum from the downloaded artifact
          SHA_WIN=$(awk '{print $1}' "artifacts/duodiff-${VERSION}-x86_64-pc-windows-msvc.zip.sha256")
          
          # Update duodiff.json using jq
          jq --arg version "${VERSION#v}" \
             --arg url "https://github.com/akunzai/duodiff/releases/download/${VERSION}/duodiff-${VERSION}-x86_64-pc-windows-msvc.zip" \
             --arg hash "$SHA_WIN" \
             --arg extract_dir "duodiff-${VERSION}-x86_64-pc-windows-msvc" \
             '.version = $version | .architecture["64bit"].url = $url | .architecture["64bit"].hash = $hash | .architecture["64bit"].extract_dir = $extract_dir' \
             scoop-bucket/bucket/duodiff.json > temp.json && mv temp.json scoop-bucket/bucket/duodiff.json
          
          # Commit and push directly to scoop-bucket main
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/duodiff.json
          git commit -m "chore: bump duodiff to ${VERSION}" || exit 0
          git push origin main

      - name: Update Homebrew formula
        env:
          HOMEBREW_BUMP_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_BUMP_TOKEN" ]; then
            echo "HOMEBREW_BUMP_TOKEN is not set; skipping Homebrew formula update."
            exit 0
          fi
          
          # Clone the tap repo
          git clone "https://x-access-token:${HOMEBREW_BUMP_TOKEN}@github.com/akunzai/homebrew-tap.git" homebrew-tap
          
          # Get SHA256 checksums from the downloaded artifacts
          SHA_MAC_INTEL=$(awk '{print $1}' "artifacts/duodiff-${VERSION}-x86_64-apple-darwin.tar.gz.sha256")
          SHA_MAC_ARM=$(awk '{print $1}' "artifacts/duodiff-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")
          SHA_LINUX_INTEL=$(awk '{print $1}' "artifacts/duodiff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256")
          SHA_LINUX_ARM=$(awk '{print $1}' "artifacts/duodiff-${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256")
          
          # Generate duodiff.rb
          cat <<EOF > homebrew-tap/Formula/duodiff.rb
class Duodiff < Formula
  desc "Fast, cross-platform terminal user interface (TUI) directory comparison tool"
  homepage "https://github.com/akunzai/duodiff"
  license "MIT"

  on_macos do
    if Hardware::CPU.intel?
      url "https://github.com/akunzai/duodiff/releases/download/${VERSION}/duodiff-${VERSION}-x86_64-apple-darwin.tar.gz"
      sha256 "${SHA_MAC_INTEL}"
    end
    if Hardware::CPU.arm?
      url "https://github.com/akunzai/duodiff/releases/download/${VERSION}/duodiff-${VERSION}-aarch64-apple-darwin.tar.gz"
      sha256 "${SHA_MAC_ARM}"
    end
  end

  on_linux do
    if Hardware::CPU.intel?
      url "https://github.com/akunzai/duodiff/releases/download/${VERSION}/duodiff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
      sha256 "${SHA_LINUX_INTEL}"
    end
    if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
      url "https://github.com/akunzai/duodiff/releases/download/${VERSION}/duodiff-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
      sha256 "${SHA_LINUX_ARM}"
    end
  end

  def install
    bin.install "duodiff"
  end

  test do
    assert_match "duodiff", shell_output("#{bin}/duodiff --help")
  end
end
EOF
          
          # Commit and push directly to homebrew-tap main
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/duodiff.rb
          git commit -m "chore: bump duodiff to ${VERSION}" || exit 0
          git push origin main
