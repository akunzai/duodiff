version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Actions are pinned to commit SHAs, so every release — patch included —
    # needs a bump here. Minor and patch bumps share one PR; a major bump
    # still arrives on its own. dtolnay/rust-toolchain is pinned to its
    # `stable` branch, which has no release tags; refresh that pin by hand.
    groups:
      github-actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
