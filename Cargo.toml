[package]
name = "duodiff"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "A fast, cross-platform terminal user interface (TUI) directory comparison tool"
repository = "https://github.com/akunzai/duodiff"
keywords = ["tui", "diff", "directory-compare", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = [
    "/.github",
    "/docs",
    "/install.sh",
    "/install.ps1",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/CONTRIBUTING.md",
    "/RELEASING.md",
    "/.gitignore",
    "/mise.toml",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/duodiff-v{ version }-{ target }{ archive-suffix }"
bin-dir = "duodiff-v{ version }-{ target }/{ bin }{ binary-ext }"


[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.35.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
similar = "3.1.1"
clap = { version = "4.4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
ureq = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
dirs = "6"
sha2 = "0.11"
anyhow = "1"
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.8"


