[package]
name = "duodiff"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ratatui = "0.26.0"
crossterm = { version = "0.27.0", features = ["event-stream"] }
tokio = { version = "1.35.0", features = ["full"] }
walkdir = "2.4.0"
similar = "2.4.0"
crc32fast = "1.3.2"
md5 = "0.7.0"
clap = { version = "4.4.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"

